# 「가명정보 A to Z」 구조 정의 — 이 파일을 고치고 python generate.py 실행
book:
  title: 가명정보 A to Z
  subtitle: 법령·기법·결합 실무 가이드
  author: 저자명
  audience: 개인정보 담당자, 데이터 분석·활용 실무자
  description: >
    개인정보 보호법상 가명정보의 개념, 처리 절차, 가명처리 기법,
    결합 및 안전조치, 사례와 FAQ, AI 시대의 가명정보 활용까지 정리합니다.
  review_days: 90      # 법령·가이드라인 개정 확인 주기
  show_drafts: false
series:
  name: AI 시대 데이터 실무 4부작
  url: "https://wikidocs.net/wiki/9013/"   # 시리즈 소개 위키 페이지
  books:   # 위키독스 공개 후 url 을 채우면 README 에 링크가 생깁니다
    - { title: "AI 300% 활용법", url: "https://wikidocs.net/book/22293" }
    - { title: "가명정보 A to Z", url: "https://wikidocs.net/book/22299" }
    - { title: "파이썬으로 시작하는 실전 퀀트 투자", url: "https://wikidocs.net/book/22336" }
    - { title: "LLM × 온톨로지 무엇을 해야할까?", url: "https://wikidocs.net/book/22298" }

chapters:
  - id: "01"
    slug: basics
    title: 가명정보 개요
    summary: 개인정보·가명정보·익명정보의 차이와 가명정보 제도가 생긴 이유, 활용 목적을 알아봅니다.
    pages:
      - { slug: definition,   title: 개인정보·가명정보·익명정보의 구분, tags: [개념, 정의] }
      - { slug: background,   title: 도입 배경 (2020 데이터 3법 개정), tags: [연혁] }
      - { slug: purposes,     title: 처리 가능 목적 (통계·과학적 연구·공익적 기록보존), tags: [목적] }

  - id: "02"
    slug: law
    title: 법령과 가이드라인
    summary: 개인정보 보호법의 가명정보 특례 조항과 개인정보보호위원회 가이드라인을 정리합니다.
    pages:
      - { slug: pipa,         title: 개인정보 보호법 가명정보 특례 조항, tags: [법령] }
      - { slug: guideline,    title: 가명정보 처리 가이드라인 요약, tags: [가이드라인] }
      - { slug: sector,       title: 분야별 가이드라인 (보건의료·금융 등), tags: [가이드라인, 분야별] }
      - { slug: penalty,      title: 위반 시 제재 (재식별 금지 등), tags: [제재] }

  - id: "03"
    slug: process
    title: 가명처리 절차
    summary: 가이드라인의 5단계 절차(사전 준비 → 위험성 검토 → 가명처리 → 적정성 검토 → 안전한 관리)를 따라갑니다.
    pages:
      - { slug: step1-prepare,  title: "1단계: 목적 설정 등 사전 준비", tags: [절차] }
      - { slug: step2-risk,     title: "2단계: 위험성 검토", tags: [절차, 위험성검토] }
      - { slug: step3-process,  title: "3단계: 가명처리", tags: [절차] }
      - { slug: step4-review,   title: "4단계: 적정성 검토", tags: [절차, 적정성검토] }
      - { slug: step5-manage,   title: "5단계: 안전한 관리", tags: [절차, 안전조치] }

  - id: "04"
    slug: techniques
    title: 가명처리 기법
    summary: 삭제·범주화·마스킹·암호화·잡음 추가 등 기법과 재식별 위험을 평가하는 프라이버시 모델을 다룹니다.
    pages:
      - { slug: deletion,       title: 삭제·부분삭제, tags: [기법] }
      - { slug: generalization, title: 범주화·라운딩, tags: [기법] }
      - { slug: masking,        title: 마스킹, tags: [기법] }
      - { slug: encryption,     title: 암호화·해시·토큰화, tags: [기법, 암호화] }
      - { slug: noise,          title: 잡음 추가·무작위화, tags: [기법] }
      - { slug: privacy-models, title: 프라이버시 모델 (k-익명성·l-다양성·t-근접성·차분프라이버시), tags: [기법, 평가] }
      - { slug: unstructured,   title: "비정형 데이터 가명처리 (이미지·영상·음성·텍스트)", tags: [기법, 비정형] }
      - { slug: pets,           title: "최신 프라이버시 강화 기술 (합성데이터·동형암호·연합학습 등)", tags: [기법, PETs] }

  - id: "05"
    slug: combination
    title: 가명정보 결합
    summary: 서로 다른 기관의 가명정보를 결합전문기관을 통해 결합하고 반출하는 절차입니다.
    pages:
      - { slug: overview,       title: 결합 절차 개요, tags: [결합] }
      - { slug: agencies,       title: 결합전문기관과 결합키관리기관, tags: [결합, 기관] }
      - { slug: export,         title: 결합 후 반출 심사, tags: [결합, 반출] }
      - { slug: lead-cases,     title: 가명정보 결합 선도사례로 보는 활용법, tags: [결합, 사례] }
      - { slug: finance-combination, title: 금융 분야 결합 (데이터전문기관), tags: [결합, 금융] }
      - { slug: national-support, title: 국가가 지원하는 가명정보 활용 제도, tags: [결합, 지원제도, 안심구역] }

  - id: "06"
    slug: security
    title: 안전조치와 사후관리
    summary: 가명정보를 처리한 뒤 지켜야 할 안전조치, 처리 기록, 보유기간과 파기를 다룹니다.
    pages:
      - { slug: measures,       title: 관리적·기술적·물리적 안전조치, tags: [안전조치] }
      - { slug: records,        title: 처리 기록 작성·보관, tags: [기록] }
      - { slug: retention,      title: 보유기간과 파기, tags: [파기] }

  - id: "07"
    slug: cases
    title: 활용 사례
    summary: 보건의료·금융·공공 분야에서 가명정보를 활용한 사례를 살펴봅니다.
    pages:
      - { slug: healthcare,     title: 보건의료 분야 사례, tags: [사례, 보건의료] }
      - { slug: finance,        title: 금융 분야 사례, tags: [사례, 금융], see_also: ["파이썬으로 시작하는 실전 퀀트 투자"] }
      - { slug: public,         title: 공공 분야 사례, tags: [사례, 공공] }
      - { slug: lessons,        title: 사례에서 배우는 활용 증진 전략, tags: [사례, 전략] }
      - { slug: research-methods, title: 가명정보로 연구하는 방법, tags: [사례, 연구, 절차] }

  - id: "08"
    slug: ai-era
    title: AI 시대의 가명정보
    summary: 생성형 AI·LLM 환경에서 가명정보를 다루는 새로운 쟁점과 방법입니다.
    pages:
      - { slug: llm-risk,       title: LLM에 개인정보를 입력할 때의 위험, tags: [AI, 위험], see_also: ["AI 300% 활용법 — 안전하게 쓰기"] }
      - { slug: ai-detection,   title: AI로 식별자 자동 탐지하기, tags: [AI, 탐지] }
      - { slug: ontology,       title: 개인정보 항목 온톨로지로 분류하기, tags: [AI, 온톨로지], see_also: ["LLM × 온톨로지 — 실전 프로젝트"] }
      - { slug: synthetic,      title: 합성데이터와 가명정보, tags: [AI, 합성데이터] }

  - id: "09"
    slug: global
    title: 해외 제도와 사례
    summary: EU·영국·미국·일본의 가명처리 제도와 최신 지침·판례를 살펴보고 우리 제도와 비교합니다.
    pages:
      - { slug: eu-gdpr,        title: "EU GDPR과 EDPB 가명처리 지침(01/2025)", tags: [해외, EU] }
      - { slug: eu-srb-case,    title: "EU 사법재판소 SRB 판결 (C-413/23 P)", tags: [해외, EU, 판례] }
      - { slug: uk-ico,         title: 영국 ICO 익명처리·가명처리 지침, tags: [해외, 영국] }
      - { slug: us-hipaa,       title: "미국 HIPAA 비식별 조치 (Safe Harbor·전문가 판단)", tags: [해외, 미국, 의료] }
      - { slug: japan-appi,     title: "일본 개인정보보호법의 가명가공정보", tags: [해외, 일본] }
      - { slug: comparison,     title: 국가별 비교와 우리에게 주는 시사점, tags: [해외, 비교] }

  - id: "90"
    slug: reference
    title: 참고자료
    summary: 용어집, 자주 묻는 질문, 참고 링크를 모았습니다.
    pages:
      - { slug: glossary,       title: 용어집, tags: [용어] }
      - { slug: faq,            title: 자주 묻는 질문, tags: [FAQ] }
      - { slug: links,          title: 참고 링크 모음, tags: [링크] }
