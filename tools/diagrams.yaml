      - { icon: "📦", title: 범주화·라운딩, desc: "37세 → 30대\n연봉 4,270만 원 → 4,000만 원대", color: amber }
      - { icon: "▒", title: 마스킹, desc: "010-1234-5678 → 010-****-5678\nhong@mail.com → h***@mail.com", color: slate }
      - { icon: "🔑", title: 암호화·해시·토큰화, desc: "고객번호 A1029 →\n9f3c…(해시값) / TKN-5821", color: indigo }
      - { icon: "🎲", title: 잡음 추가·무작위화, desc: "키 172cm → 173cm (±2 범위)\n같은 집단의 값 순서 섞기", color: violet }
      - { icon: "📊", title: 프라이버시 모델, desc: "k-익명성 · l-다양성 ·\nt-근접성 · 차분 프라이버시로\n재식별 위험 평가", color: teal }

  - file: ch05-combination.png
