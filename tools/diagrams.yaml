# 「가명정보 A to Z」 설명 이미지 정의 — 수정 후 python tools/build_diagrams.py
theme:
  book: 가명정보 A to Z
  primary: teal
  secondary: indigo

diagrams:
  - file: ch01-spectrum.png
    kicker: CHAPTER 01 · 가명정보 개요
    layout: spectrum
    title: 개인정보 · *가명정보* · 익명정보
    subtitle: 특정 개인을 알아볼 수 있는 정도에 따라 세 가지로 나뉩니다
    left_label: "◀ 개인을 알아보기 쉬움"
    right_label: "개인을 알아볼 수 없음 ▶"
    items:
      - { icon: "🪪", title: 개인정보, desc: "이름·연락처 등으로\n특정 개인을 알아볼 수 있음\n\n→ 원칙적으로 동의 필요", color: red }
      - { icon: "🎭", title: 가명정보, desc: "추가정보 없이는\n특정 개인을 알아볼 수 없음\n\n→ 통계·연구·공익적 기록보존에\n   동의 없이 활용 가능", color: amber }
      - { icon: "🌫️", title: 익명정보, desc: "다른 정보와 합쳐도\n개인을 알아볼 수 없음\n\n→ 개인정보 보호법\n   적용 대상 아님", color: emerald }
    note: "가명정보도 개인정보입니다 — 안전조치와 재식별 금지 의무가 따릅니다"

  - file: ch02-law-map.png
    kicker: CHAPTER 02 · 법령과 가이드라인
    layout: cards
    columns: 3
    title: 가명정보 *특례 조항* 한눈에 보기
    subtitle: 개인정보 보호법 제3장 제3절 「가명정보의 처리에 관한 특례」
    cards:
      - { icon: "✅", title: 제28조의2 처리, desc: "통계작성·과학적 연구·\n공익적 기록보존 목적이면\n동의 없이 처리 가능", color: teal }
      - { icon: "🔗", title: 제28조의3 결합, desc: "서로 다른 처리자 간 결합은\n지정된 결합전문기관이 수행", color: indigo }
      - { icon: "🛡️", title: 제28조의4 안전조치, desc: "추가정보 분리 보관,\n처리 기록 작성·보관,\n처리 기간 설정", color: blue }
      - { icon: "🚫", title: 제28조의5 금지의무, desc: "특정 개인을 알아보기 위한\n처리 금지, 알아볼 수 있게\n되면 즉시 중지·회수·파기", color: red }
      - { icon: "📋", title: 제28조의7 적용범위, desc: "열람·정정·삭제 요구 등\n일부 조항 적용 제외", color: slate }
