      - { icon: "🔍", title: 위험성 검토, desc: "데이터 자체의\n식별 위험 +\n처리 환경 위험", color: violet }
      - { icon: "🎭", title: 가명처리, desc: "항목별 기법 적용\n(삭제·범주화 등)\n결과 자체 검수", color: teal }
      - { icon: "🧑‍⚖️", title: 적정성 검토, desc: "외부 전문가 포함\n위원회가 목적·\n처리 결과 검토", color: amber }
      - { icon: "🔐", title: 안전한 관리, desc: "안전조치, 기록,\n재식별 모니터링,\n기간 경과 시 파기", color: emerald }
