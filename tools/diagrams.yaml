# 「가명정보 A to Z」 설명 이미지 정의 — 수정 후 python tools/build_diagrams.py
theme:
  book: 가명정보 A to Z
  primary: teal
  secondary: indigo

diagrams:
  - file: ch01-spectrum.png
    kicker: CHAPTER 01 · 가명정보 개요
    layout: spectrum
    title: 개인정보 · *가명정보* · 익명정보
    subtitle: 특정 개인을 알아볼 수 있는 정도에 따라 세 가지로 나뉩니다
    left_label: "◀ 개인을 알아보기 쉬움"
    right_label: "개인을 알아볼 수 없음 ▶"
    items:
      - { icon: "🪪", title: 개인정보, desc: "이름·연락처 등으로\n특정 개인을 알아볼 수 있음\n\n→ 원칙적으로 동의 필요", color: red }
      - { icon: "🎭", title: 가명정보, desc: "추가정보 없이는\n특정 개인을 알아볼 수 없음\n\n→ 통계·연구·공익적 기록보존에\n   동의 없이 활용 가능", color: amber }
      - { icon: "🌫️", title: 익명정보, desc: "다른 정보와 합쳐도\n개인을 알아볼 수 없음\n\n→ 개인정보 보호법\n   적용 대상 아님", color: emerald }
    note: "가명정보도 개인정보입니다 — 안전조치와 재식별 금지 의무가 따릅니다"

  - file: ch02-law-map.png
    kicker: CHAPTER 02 · 법령과 가이드라인
    layout: cards
    columns: 3
    title: 가명정보 *특례 조항* 한눈에 보기
    subtitle: 개인정보 보호법 제3장 제3절 「가명정보의 처리에 관한 특례」
    cards:
      - { icon: "✅", title: 제28조의2 처리, desc: "통계작성·과학적 연구·\n공익적 기록보존 목적이면\n동의 없이 처리 가능", color: teal }
      - { icon: "🔗", title: 제28조의3 결합, desc: "서로 다른 처리자 간 결합은\n지정된 결합전문기관이 수행", color: indigo }
      - { icon: "🛡️", title: 제28조의4 안전조치, desc: "추가정보 분리 보관,\n처리 기록 작성·보관,\n처리 기간 설정", color: blue }
      - { icon: "🚫", title: 제28조의5 금지의무, desc: "특정 개인을 알아보기 위한\n처리 금지, 알아볼 수 있게\n되면 즉시 중지·회수·파기", color: red }
      - { icon: "📋", title: 제28조의7 적용범위, desc: "열람·정정·삭제 요구 등\n일부 조항 적용 제외", color: slate }
      - { icon: "⚖️", title: 제64조의2 과징금, desc: "재식별 목적 처리 등 위반 시\n전체 매출액 기준 과징금", color: orange }
    note: "조문은 개정될 수 있습니다 — 국가법령정보센터 원문으로 확인하세요"

  - file: ch03-five-steps.png
    kicker: CHAPTER 03 · 가명처리 절차
    layout: flow
    title: 가명처리 *5단계* 절차
    subtitle: 「가명정보 처리 가이드라인」(개인정보보호위원회, 2024.2. 개정) 기준
    steps:
      - { icon: "🎯", title: 사전 준비, desc: "처리 목적 설정\n필요한 항목 선정\n관련 서류 작성", color: blue }
      - { icon: "🔍", title: 위험성 검토, desc: "데이터 자체의\n식별 위험 +\n처리 환경 위험", color: violet }
      - { icon: "🎭", title: 가명처리, desc: "항목별 기법 적용\n(삭제·범주화 등)\n결과 자체 검수", color: teal }
      - { icon: "🧑‍⚖️", title: 적정성 검토, desc: "외부 전문가 포함\n위원회가 목적·\n처리 결과 검토", color: amber }
      - { icon: "🔐", title: 안전한 관리, desc: "안전조치, 기록,\n재식별 모니터링,\n기간 경과 시 파기", color: emerald }
    note: "적정성 검토를 통과하지 못하면 앞 단계로 돌아가 다시 처리합니다"

  - file: ch04-techniques.png
    kicker: CHAPTER 04 · 가명처리 기법
    layout: cards
    columns: 3
    title: 주요 *가명처리 기법*
    subtitle: 예시 원본 → 처리 결과 (모두 가상의 데이터입니다)
    cards:
      - { icon: "✂️", title: 삭제·부분삭제, desc: "홍길동 → (삭제)\n서울시 강남구 역삼동 → 서울시", color: red }
      - { icon: "📦", title: 범주화·라운딩, desc: "37세 → 30대\n연봉 4,270만 원 → 4,000만 원대", color: amber }
      - { icon: "▒", title: 마스킹, desc: "010-1234-5678 → 010-****-5678\nhong@mail.com → h***@mail.com", color: slate }
      - { icon: "🔑", title: 암호화·해시·토큰화, desc: "고객번호 A1029 →\n9f3c…(해시값) / TKN-5821", color: indigo }
      - { icon: "🎲", title: 잡음 추가·무작위화, desc: "키 172cm → 173cm (±2 범위)\n같은 집단의 값 순서 섞기", color: violet }
      - { icon: "📊", title: 프라이버시 모델, desc: "k-익명성 · l-다양성 ·\nt-근접성 · 차분 프라이버시로\n재식별 위험 평가", color: teal }

  - file: ch05-combination.png
    kicker: CHAPTER 05 · 가명정보 결합
    layout: flow
    title: 서로 다른 기관의 *가명정보 결합*
    subtitle: 결합은 직접 하지 않고 결합전문기관을 거칩니다
    steps:
      - { icon: "🏢", title: 결합 신청, desc: "A기관·B기관이\n결합전문기관에\n결합 신청", color: blue }
      - { icon: "🔑", title: 결합키 생성, desc: "각 기관이 결합키를\n만들어 결합키관리\n기관에 전달", color: indigo }
      - { icon: "🔗", title: 결합, desc: "결합전문기관이\n결합키 기준으로\n데이터 결합", color: teal }
      - { icon: "🧑‍⚖️", title: 반출 심사, desc: "추가 가명처리 후\n반출심사위원회\n적정성 심사", color: amber }
      - { icon: "📤", title: 반출·활용, desc: "승인된 결합정보만\n기관 밖으로 반출\n(안전조치 유지)", color: emerald }
    note: "결합된 정보는 추가 가명처리와 반출 심사를 거쳐야 기관 밖으로 가져갈 수 있습니다"

  - file: ch06-safety.png
    kicker: CHAPTER 06 · 안전조치와 사후관리
    layout: stack
    title: 가명정보 *안전조치* 3겹
    subtitle: 기술적·관리적·물리적 조치를 함께 적용합니다
    layers:
      - { icon: "💻", title: 기술적 조치, desc: "추가정보 분리 보관 · 접근권한 최소화 · 접속기록 보관 · 암호화", color: indigo }
      - { icon: "📋", title: 관리적 조치, desc: "내부관리계획 · 처리 기록 작성·보관 · 담당자 교육 · 재식별 모니터링", color: teal }
      - { icon: "🏛️", title: 물리적 조치, desc: "보관 장소 출입 통제 · 분석 전용 공간 · 저장매체 반출 관리", color: amber }
    note: "처리 기간이 끝나면 가명정보를 지체 없이 파기합니다"

  - file: ch07-cases.png
    kicker: CHAPTER 07 · 활용 사례
    layout: cards
    columns: 3
    title: 분야별 *활용 사례* 유형
    subtitle: 어떤 목적에서 가명정보가 쓰이는지 유형별로 살펴봅니다
    cards:
      - { icon: "🏥", title: 보건의료, desc: "진료·검사 데이터로\n질병 예측·신약 연구\n(과학적 연구)", color: teal }
      - { icon: "💳", title: 금융, desc: "카드·대출 데이터로\n소비 트렌드 분석,\n신용평가 모형 개발", color: indigo }
      - { icon: "🏛️", title: 공공, desc: "교통·인구 데이터로\n정책 수립용 통계,\n공공서비스 개선", color: amber }

  - file: ch08-ai-era.png
    kicker: CHAPTER 08 · AI 시대의 가명정보
    layout: compare
    title: LLM에 데이터를 넣기 *전에*
    subtitle: 생성형 AI에 개인정보를 그대로 넣지 말고 가명처리부터 합니다
    left:
      title: 그대로 입력
      items:
        - "김민수(42세, 010-****) 상담 기록 원문"
        - "환자 이름이 들어간 진료 메모"
        - "고객번호·계좌번호가 있는 엑셀"
    right:
      title: 가명처리 후 입력
      items:
        - "고객A(40대) 상담 기록, 연락처 삭제"
        - "이름 삭제, 날짜는 월 단위로 범주화"
        - "고객번호 → 토큰, 계좌번호 삭제"
    note: "회사에서 허용한 AI 도구인지, 입력 데이터가 학습에 쓰이지 않는지 확인하세요"

  - file: ch90-reference.png
    kicker: 참고자료
    layout: cards
    columns: 3
    title: 참고자료 *활용법*
    cards:
      - { icon: "📖", title: 용어집, desc: "가명처리·추가정보·\n결합키 등 핵심 용어", color: teal }
      - { icon: "❓", title: 자주 묻는 질문, desc: "실무에서 자주 막히는\n질문과 답", color: indigo }
      - { icon: "🔗", title: 참고 링크, desc: "법령 원문·가이드라인·\n공식 기관 사이트", color: amber }

  # ---------- 페이지 이미지 ----------
  - file: p01-3-purposes.png
    kicker: 01-3 · 처리 가능 목적
    layout: cards
    columns: 3
    title: 동의 없이 가명정보를 쓸 수 있는 *세 가지 목적*
    subtitle: 개인정보 보호법 제28조의2 제1항
    cards:
      - { icon: "📈", title: 통계작성, desc: "특정 집단의 경향과\n특성을 수치로 나타냄\n\n예) 지역·연령대별\n이용 현황 통계", color: blue }
      - { icon: "🔬", title: 과학적 연구, desc: "기술 개발·실증,\n기초·응용 연구\n(민간 투자 연구 포함)\n\n예) 서비스 개선 연구", color: teal }
      - { icon: "🗄️", title: 공익적 기록보존, desc: "공공의 이익을 위해\n지속적으로 보존할\n가치가 있는 기록\n\n예) 역사적 자료 보존", color: amber }
    note: "목적이 이 세 가지에 해당하는지 먼저 판단하고, 그 근거를 문서로 남기세요"
