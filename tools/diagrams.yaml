    steps:
      - { icon: "🏢", title: 결합 신청, desc: "A기관·B기관이\n결합전문기관에\n결합 신청", color: blue }
      - { icon: "🔑", title: 결합키 생성, desc: "각 기관이 결합키를\n만들어 결합키관리\n기관에 전달", color: indigo }
      - { icon: "🔗", title: 결합, desc: "결합전문기관이\n결합키 기준으로\n데이터 결합", color: teal }
      - { icon: "🧑‍⚖️", title: 반출 심사, desc: "추가 가명처리 후\n반출심사위원회\n적정성 심사", color: amber }
      - { icon: "📤", title: 반출·활용, desc: "승인된 결합정보만\n기관 밖으로 반출\n(안전조치 유지)", color: emerald }
